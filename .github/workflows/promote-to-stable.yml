name: Promote

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  promote:
    name: ⬆️ Promote to latest/stable
    environment: "Candidate Branch"
    runs-on: ubuntu-latest
    if: |
      ( !github.event.issue.pull_request )
      && contains(github.event.comment.body, '/promote ')
      && contains(github.event.comment.body, 'latest/stable')
      && endsWith(github.event.issue.title, ' on channel `latest/candidate`')
      && contains(github.event.issue.body, 'latest/stable')
      && contains(github.event.issue.labels.*.name, 'testing')
    steps:
      - name: ⬆️ Promote to latest/stable
        uses: snapcrafters/ci/promote-to-stable@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          store-token: ${{ secrets.SNAP_STORE_STABLE }}

  promote-3:
    name: ⬆️ Promote to 3/stable
    environment: "3 Branch"
    runs-on: ubuntu-latest
    if: |
      ( !github.event.issue.pull_request )
      && contains(github.event.comment.body, '/promote ')
      && contains(github.event.comment.body, '3/stable')
      && endsWith(github.event.issue.title, ' on channel `3/candidate`')
      && contains(github.event.issue.body, '3/stable')
      && contains(github.event.issue.labels.*.name, 'testing')
    steps:
      - name: ⬆️ Promote to 3/stable
        uses: snapcrafters/ci/promote-to-stable@main
        with:
          channel: 3/stable
          github-token: ${{ secrets.GITHUB_TOKEN }}
          store-token: ${{ secrets.SNAP_STORE_STABLE }}