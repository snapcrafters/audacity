name: Pull Request

on:
  pull_request:
    branches: ["3"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🧪 Build snap on amd64
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: 🧪 Build snap on amd64
        uses: snapcrafters/ci/test-snap-build@main